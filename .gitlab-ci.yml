include:
  - component: $CI_SERVER_FQDN/m13tLabs/gitlab-helpers/pipeline-ci-components@v0.3.1
  # include the component located in the current project from the current SHA
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/runner@$CI_COMMIT_SHA
    inputs:
      # renovate: datasource=github-tags depName=renovatebot/renovate
      renovate_version: '44.190.2'
      renovate_image: 'ghcr.io/renovatebot/renovate'
      rules:
        # don't run on tags
        - if: $CI_COMMIT_TAG
          when: never
  # test the config-validate component against this project's own renovate.json5
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/config-validate@$CI_COMMIT_SHA
    inputs:
      renovate_presets:
        - renovate.json5
        - templates/config-validate.yml
        - templates/shared/renovate.yml

variables:
  RENOVATE_AUTODISCOVER_FILTER: "cloudtooling/**"

stages: [build, test, integration-test, deploy, release, run]

Setup Renovate:
  variables:
    SERVICEACCOUNT_GROUP_ID: 75898119
    GITLAB_TOKEN: $GITLAB_SETUP_TOKEN

Unit-Tests Templates:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push'
      changes:
        - templates/**/*
        - tests/**/*
  script:
    - bats --report-formatter junit --print-output-on-failure --output reports tests/
  artifacts:
    when: always
    paths:
      - reports/report.xml
    reports:
      junit: reports/report.xml
