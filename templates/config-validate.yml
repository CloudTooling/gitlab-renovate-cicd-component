spec:
  description: Validate Renovate Config preset(s).
  inputs:
    log_level:
      type: string
      options:
        - debug
        - info
      default: debug
    rules:
      # FIXME: eventually, we'll want to define `null` as the default,
      # but this is NOT support yet, see
      # https://gitlab.com/gitlab-org/gitlab/-/issues/440468
      default:
        - when: on_success
      type: array
      description: 'Defines the `rules` of the job.'
    renovate_image:
      type: string
      default: 'ghcr.io/renovatebot/renovate'
    renovate_version:
      type: string
      # renovate: datasource=github-tags depName=renovatebot/renovate
      default: '44.69.14'
    renovate_presets:
      type: string
      description: 'Space-separated preset/config files to validate.'
      default: 'default.json default.json5 renovate.json renovate.json5'
    stage:
      default: test
    before_script:
      default: []
      description: 'Defines the `before_script` of the job, useful for extra extends like docker login.'
---
variables:
  RENOVATE_IMAGE: $[[ inputs.renovate_image ]]:$[[ inputs.renovate_version ]]
  RENOVATE_LOG_FILE_LEVEL: $[[ inputs.log_level ]]
  LOG_LEVEL: $[[ inputs.log_level ]]

stages:
  - linting
  - $[[ inputs.stage ]]

include:
  - local: 'templates/shared/renovate.yml'
    inputs:
      before_script: $[[ inputs.before_script ]]

Validate Config:
  stage: $[[ inputs.stage ]]
  extends: .renovate-config-validate
  variables:
    RENOVATE_CONFIG_FILES: $[[ inputs.renovate_presets ]]
  rules:
    - changes: ['*.json', '*.json5']
